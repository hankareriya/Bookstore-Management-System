<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Book Management</title>
</head>
<body>
    <div class="navbar">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/books">Manage Books</a></li>
            <li><a href="/categories">Manage Categories</a></li>
            <li><a href="/customers">Manage Customers</a></li>
            <li><a href="/orders">Manage Orders</a></li>
            <li><a href="/reviews">Customer Reviews</a></li>
            <li><a href="/shipping">Shipping Details</a></li>
        </ul>
    </div>

    <h1>Book Management</h1>

    <form class="form" action="/add_book" method="post">
        <input type="text" name="book_name" placeholder="Book Name" required>
        <input type="number" step="0.01" name="price" placeholder="Price" required>
        <input type="date" name="release_date">
        <input type="number" name="stock" placeholder="Stock" required>
        <button type="submit">Add Book</button>
    </form>

    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Release Date</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book[0] }}</td>
                <td>{{ book[1] }}</td>
                <td>{{ book[2] }}</td>
                <td>{{ book[3] }}</td>
                <td>{{ book[4] }}</td>
                <td><a href="/delete_book/{{ book[0] }}" class="delete-btn">Delete</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
